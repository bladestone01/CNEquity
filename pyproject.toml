[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-lake"
version = "0.2.0"
description = "Self-hosted A-share Parquet data lake with multi-source ingest and daily orchestration"
# Short PyPI page (absolute links only). GitHub keeps README.md / README.en.md.
readme = "README.pypi.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ashare-lake Contributors" }]
keywords = ["a-share", "stock", "data-engineering", "parquet", "duckdb"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "click>=8.1",
  "duckdb>=1.0",
  # The 0.25 floor existed only so mootdx (httpx>=0.25,<0.26) could co-resolve.
  # mootdx is gone — the TDX client is vendored — so nothing caps httpx now and
  # the floor just marks the oldest release with the Client() options we use.
  "httpx>=0.25",
  # Chrome TLS impersonation for push2his (plain httpx often gets Empty reply overseas).
  "curl_cffi>=0.7",
  "polars>=1.0",
  "pyarrow>=15.0",
]

[project.optional-dependencies]
# Kept as an empty extra so `pip install "ashare-lake[tdx]"` — printed in older
# docs, READMEs and pinned requirement files — keeps resolving instead of
# erroring. The TDX wire client is vendored now (adapters/tdx_protocol/_wire),
# so quotes need no third-party package at all.
tdx = []
macro = ["akshare>=1.14"]
nlp = ["snownlp>=0.12"]
valuation = ["baostock>=0.8"]
structure = ["pandas>=2.0", "openpyxl>=3.0", "xlrd>=2.0"]
# Every runtime source in one install — what a full daily pipeline needs.
# Self-referential so the members stay defined in exactly one place.
#
# Caveat this cannot express: akshare pulls `mini-racer`, mootdx pulls
# `py-mini-racer`, and both distributions install into the same `py_mini_racer`
# import package. Installers do not detect that, so the last one wins and the
# survivor can be a loader mismatched to its binary. It does not affect the
# endpoints this project calls (all in akshare modules that never eval JS), but
# it can break akshare's own cninfo/sina APIs if called directly. `asl doctor`
# reports it. mootdx pins py-mini-racer<0.7, so there is no version to resolve to.
all = ["ashare-lake[tdx,macro,nlp,valuation,structure]"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-timeout>=2.3",
  # Pinned to a minor line: CI runs `ruff format --check`, and the formatter's
  # line-wrapping changes between minors, so an unpinned `ruff>=0.4` turns any
  # upstream release into a red build on code nobody touched.
  "ruff>=0.15,<0.16",
]

[project.urls]
Documentation = "https://github.com/rootSunc/ashare-lake/tree/main/docs"
Source = "https://github.com/rootSunc/ashare-lake"
Changelog = "https://github.com/rootSunc/ashare-lake/blob/main/CHANGELOG.md"
Issues = "https://github.com/rootSunc/ashare-lake/issues"

[project.scripts]
asl = "ashare_lake.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ashare_lake = [
    "py.typed",
    "adapters/calendar/seeds/*.csv",
    "adapters/ths/seeds/*.json",
    "config/templates/*.toml",
    # MIT requires the notice to travel with every copy of the vendored code.
    "adapters/tdx_protocol/_wire/LICENSE.tdxpy",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Vendored upstream code (tdxpy, MIT). Kept byte-close to its source so it can be
# re-synced or diffed against upstream; reformatting it to our rules would only
# make that harder, and the style is not ours to own.
extend-exclude = ["src/ashare_lake/adapters/tdx_protocol/_wire"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Scripts insert repo src onto sys.path before importing the package.
"scripts/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["ashare_lake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Network probes (EastMoney schema contracts, etc.) run only with `-m network`.
addopts = "-ra -m 'not network'"
# Fail loud on a hung test instead of blocking the whole suite and leaving an
# orphaned process behind. The full suite runs in ~10s; 120s is generous slack.
# `thread` method dumps a traceback pinpointing where the hang occurred.
timeout = 120
timeout_method = "thread"
markers = [
  "integration: end-to-end tests that exercise the full pipeline (may be slower)",
  "network: tests that require outbound network access",
]

[tool.coverage.run]
source = ["ashare_lake"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
