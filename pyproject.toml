[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-data-engine"
version = "0.1.0"
description = "A-share data ingestion orchestrator with Parquet lake delivery"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "StockDataEngine Contributors" }]
keywords = ["a-share", "stock", "data-engineering", "parquet", "duckdb"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "click>=8.1",
  "duckdb>=1.0",
  "httpx>=0.27",
  "polars>=1.0",
  "pyarrow>=15.0",
]

[project.optional-dependencies]
tdx = ["mootdx>=0.11"]
macro = ["akshare>=1.14"]
nlp = ["snownlp>=0.12"]
valuation = ["baostock>=0.8"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]

[project.urls]
Documentation = "https://github.com/your-org/StockDataEngine/tree/main/docs"
Source = "https://github.com/your-org/StockDataEngine"
Changelog = "https://github.com/your-org/StockDataEngine/blob/main/CHANGELOG.md"

[project.scripts]
sde = "stock_data_engine.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stock_data_engine = ["py.typed", "adapters/calendar/seeds/*.csv"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["stock_data_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: end-to-end tests that exercise the full pipeline (may be slower)",
  "network: tests that require outbound network access",
]

[tool.coverage.run]
source = ["stock_data_engine"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
