[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-lake"
version = "0.3.1"
description = "Self-hosted A-share Parquet data lake with multi-source ingest and daily orchestration"
# Short PyPI page (absolute links only). GitHub keeps README.md / README.en.md.
readme = "README.pypi.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ashare-lake Contributors" }]
keywords = ["a-share", "stock", "data-engineering", "parquet", "duckdb"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
]
# One install, no extras: `pip install ashare-lake` brings every runtime source
# the daily pipeline and the backfill paths need. Splitting these out again would
# bring back the failure mode that motivated folding them in — a source enabled
# in config with no package behind it, degrading silently on a scheduled run.
dependencies = [
  "click>=8.1",
  "duckdb>=1.0",
  # The 0.25 floor existed only so mootdx (httpx>=0.25,<0.26) could co-resolve.
  # mootdx is gone — the TDX client is vendored — so nothing caps httpx now and
  # the floor just marks the oldest release with the Client() options we use.
  "httpx>=0.25",
  # Chrome TLS impersonation for push2his (plain httpx often gets Empty reply overseas).
  "curl_cffi>=0.7",
  "polars>=1.0",
  "pyarrow>=15.0",
  # No AkShare. Its two call sites wrapped endpoints already queried directly —
  # the ST board (push2 clist) and the PMI / 货币供应量 datacenter reports — so it
  # bought a parsing layer, 14 transitive packages and the mini-racer collision
  # rather than a second source. See issue #3.
  # Baostock: valuation / ST / delisted-bar history for `asl init` and backfills.
  "baostock>=0.8",
  # SnowNLP: on-demand stock_news sentiment ([sentiment] use_snownlp).
  "snownlp>=0.12",
  # Shenwan / CNI publish constituent history as XLS and XLSX only; polars cannot
  # read either, so pandas is here as a parser, not as a dataframe layer.
  "pandas>=2.0",
  "openpyxl>=3.0",
  "xlrd>=2.0",
  # stdlib tomllib is 3.11+; config loader falls back to tomli on 3.10.
  "tomli>=2; python_version < '3.11'",
]

# No [project.optional-dependencies]. Everything is a hard dependency.
# `pip install "ashare-lake[tdx]"` from an older doc still installs correctly —
# pip prints "does not provide the extra 'tdx'" and carries on, uv is silent —
# so declaring empty extras would only advertise things that no longer exist.

# Contributor tooling lives in a PEP 735 dependency group, not an extra: it is
# never part of what a user installs. `pip install --group dev` (pip >= 25.1) or
# `uv sync`.
[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-timeout>=2.3",
  # Pinned to a minor line: CI runs `ruff format --check`, and the formatter's
  # line-wrapping changes between minors, so an unpinned `ruff>=0.4` turns any
  # upstream release into a red build on code nobody touched.
  "ruff>=0.15,<0.16",
]

[project.urls]
Documentation = "https://github.com/rootSunc/ashare-lake/tree/main/docs"
Source = "https://github.com/rootSunc/ashare-lake"
Changelog = "https://github.com/rootSunc/ashare-lake/blob/main/CHANGELOG.md"
Issues = "https://github.com/rootSunc/ashare-lake/issues"

[project.scripts]
asl = "ashare_lake.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ashare_lake = [
    "py.typed",
    "adapters/calendar/seeds/*.csv",
    "adapters/ths/seeds/*.json",
    "config/templates/*.toml",
    # MIT requires the notice to travel with every copy of the vendored code.
    "adapters/tdx_protocol/_wire/LICENSE.tdxpy",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# Vendored upstream code (tdxpy, MIT). Kept byte-close to its source so it can be
# re-synced or diffed against upstream; reformatting it to our rules would only
# make that harder, and the style is not ours to own.
extend-exclude = ["src/ashare_lake/adapters/tdx_protocol/_wire"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Scripts insert repo src onto sys.path before importing the package.
"scripts/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["ashare_lake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Network probes (EastMoney schema contracts, etc.) run only with `-m network`.
addopts = "-ra -m 'not network'"
# Fail loud on a hung test instead of blocking the whole suite and leaving an
# orphaned process behind. The full suite runs in ~10s; 120s is generous slack.
# `thread` method dumps a traceback pinpointing where the hang occurred.
timeout = 120
timeout_method = "thread"
markers = [
  "integration: end-to-end tests that exercise the full pipeline (may be slower)",
  "network: tests that require outbound network access",
]

[tool.coverage.run]
source = ["ashare_lake"]
branch = true
# Vendored upstream (tdxpy, MIT). Same boundary as ruff extend-exclude: we own
# the facade around it, not every struct.unpack line inside.
omit = ["*/adapters/tdx_protocol/_wire/*", "*/adapters/tdx_protocol/_wire/**"]

[tool.coverage.report]
show_missing = true
skip_empty = true
