name: Supply-chain security

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and scanners
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pip-audit cyclonedx-bom

      - name: Generate CycloneDX SBOM
        run: cyclonedx-py environment --output-format JSON --output-file sbom.cdx.json

      - name: Audit installed dependencies
        run: pip-audit --local --format=json --output=pip-audit.json

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-evidence
          path: |
            sbom.cdx.json
            pip-audit.json
          if-no-files-found: warn
