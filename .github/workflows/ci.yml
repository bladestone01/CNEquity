name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        # structure/macro cover pandas+akshare used by unit tests; skip [tdx]
        # (mootdx pins httpx<0.26 and conflicts with the default resolver).
        run: pip install -e ".[dev,structure,macro,nlp,valuation]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest
