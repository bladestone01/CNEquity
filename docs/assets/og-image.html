<!doctype html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1280px; height:640px; overflow:hidden; }
  body {
    background:#0d1117;
    font-family:"PingFang SC","Helvetica Neue",-apple-system,sans-serif;
    color:#e6edf3; position:relative;
  }
  .shot {
    position:absolute; right:-170px; top:54px; width:790px;
    border-radius:10px; opacity:.30;
    filter:brightness(.42) saturate(.75) contrast(1.15);
    -webkit-mask-image:
      linear-gradient(103deg, transparent 2%, #000 52%),
      linear-gradient(#000 0%, #000 58%, transparent 88%);
    mask-image:
      linear-gradient(103deg, transparent 2%, #000 52%),
      linear-gradient(#000 0%, #000 58%, transparent 88%);
    -webkit-mask-composite:source-in; mask-composite:intersect;
  }
  .scrim {
    position:absolute; inset:0;
    background:linear-gradient(95deg, #0d1117 30%, rgba(13,17,23,.55) 58%, transparent 78%);
  }
  .glow {
    position:absolute; left:-200px; top:-220px; width:900px; height:900px;
    background:radial-gradient(circle, rgba(45,120,255,.22) 0%, transparent 62%);
  }
  .wrap { position:relative; padding:84px 0 0 84px; width:800px; }
  .eyebrow {
    font-size:21px; letter-spacing:.16em; color:#58a6ff;
    font-weight:600; margin-bottom:26px;
  }
  h1 { font-size:82px; line-height:1.05; font-weight:800; letter-spacing:-.02em; }
  h1 .dim { color:#7d8590; font-weight:700; font-size:64px; }
  .tag {
    margin-top:30px; font-size:31px; line-height:1.5; color:#c9d1d9; font-weight:400;
  }
  .tag b { color:#fff; font-weight:700; }
  .stats { margin-top:48px; display:flex; gap:16px; }
  .pill {
    border:1px solid #30363d; background:rgba(22,27,34,.85); border-radius:999px;
    padding:13px 24px; font-size:23px; color:#e6edf3; font-weight:600;
  }
  .foot {
    position:absolute; left:84px; bottom:52px; display:flex;
    align-items:center; gap:22px; font-size:25px; color:#7d8590;
  }
  .foot .cmd {
    font-family:"SF Mono",Menlo,monospace; color:#7ee787;
    background:rgba(22,27,34,.9); border:1px solid #30363d;
    padding:9px 20px; border-radius:8px; font-size:24px;
  }
</style></head>
<body>
  <img class="shot" src="asl-serve.png">
  <div class="scrim"></div>
  <div class="glow"></div>
  <div class="wrap">
    <div class="eyebrow">ASHARE-LAKE</div>
    <h1>ASL</h1>
    <div class="tag">
      本地可<b>日更</b>的 A 股研究湖<br>
      别再每次重拉、自己拼复权了
    </div>
    <div class="stats">
      <div class="pill">39 个数据集</div>
      <div class="pill">日线回溯 2001</div>
      <div class="pill">一条命令起湖</div>
    </div>
  </div>
  <div class="foot">
    <span class="cmd">pip install ashare-lake</span>
    <span>MIT · github.com/rootSunc/ashare-lake</span>
  </div>
</body></html>
