# Example / default ashare-lake config.
# Repo copy: configs/ashare-lake.example.toml
# Packaged copy: src/ashare_lake/config/templates/ashare-lake.example.toml
# Keep both identical — `asl config init` ships the packaged file.

[data]
root = "./data/ashare-lake"

[orchestrator]
# macOS must use workers = 1 (the TDX client is not fork-safe; ProcessPool → BrokenProcessPool).
# Windows defaults to 1 via `asl config init` (spawn is fine; raise after a clean doctor).
# Linux may use >1; keep batch_size modest under memory pressure.
workers = 8
batch_size = 100
max_retries = 3
retry_backoff_seconds = 5
batch_stale_seconds = 3600  # running batches without heartbeat for this long → stale (compact gate) / failed (retry)

[tdx_protocol]
enabled = true
# Cross-process paced; 100ms is safer for long daily sweeps than 50ms.
min_interval_ms = 100
servers = "auto"
connect_timeout_sec = 10
# Test/demo only: return fabricated rows (labeled source="mock") instead of
# failing when the TDX source is unavailable. Never enable in production.
allow_mock = false

# Preferred standard-market host pool. When servers="auto", these are probed
# in parallel (first that returns real data wins) before the bundled
# list. Fill with hosts known-good for your network; leave empty to rely on
# the bundled list. Extended (HK/futures) hosts do not serve A-share bars.
[tdx_protocol.hosts]
standard = [
    "120.76.1.198:7709",
    "123.125.108.101:7709",
    "114.141.177.118:7709",
    "114.141.177.40:7709",
    "27.151.2.113:7709",
    "27.151.2.38:7709",
    "202.100.166.12:7709",
    "182.118.8.9:7709",
    "1.202.143.37:7709",
    "111.203.134.118:7709",
    "117.133.128.226:7709",
]

[sources.eastmoney]
enabled = true
# push2his bans bursty overseas/cloud IPs — keep slow for sector_bars sweeps.
min_interval_seconds = 3.0
# Per-request timeout (seconds). Connect/timeout/protocol errors do not retry.
timeout_sec = 30
batch_size = 15
batch_rest_seconds = 60
# Optional: mainland HTTP(S) proxy for push2his kline (sector_bars backfill).
# When unset, httpx still honors HTTPS_PROXY / HTTP_PROXY env vars.
# proxy = "http://127.0.0.1:7890"

[sources.ths]
# 同花顺 — primary source for sector_bars (board index OHLC), history and daily.
# push2his (EastMoney's kline host) refuses non-mainland egress at the WAF layer,
# and mixing sources put two index bases in one series; see docs.
enabled = true
# d.10jqka.com.cn (kline). Measured safe: ~1300 sequential requests at this pace
# with zero failures, which is a full 432-board sweep in ~8 min. Do not lower it —
# a rate-limit ban costs far more than the minutes it saves.
min_interval_seconds = 1.0

[sources.ths_pages]
# q.10jqka.com.cn (board catalog and listing pages) is far less tolerant than the
# kline host: it began returning 401 after ~23 requests at 1 req/s. Only the
# catalog build touches it (~95 requests, then cached to
# meta/state/ths_board_catalog.json), so a slow interval costs a rare ~30 min
# rebuild rather than anything on the daily path.
# This value is a conservative guess: the only figure actually measured is the
# rate that got blocked, not one observed to be safe.
enabled = true
min_interval_seconds = 20.0

[sources.cninfo]
enabled = true
min_interval_seconds = 1.0

# 商务部数据中心 — publishes 社会融资规模增量 (macro_indicators).
[sources.mofcom]
enabled = true
min_interval_seconds = 1.0

[sources.sina]
enabled = true
min_interval_seconds = 0.3

# Free TCP API. Official limits: ≤50k API requests/day, no concurrent connections;
# exceeding either puts the IP on the blacklist (error_code=10001011).
# Full-market history must be slow or the IP gets blacklisted.
# ~5000 symbols × (1s + batch rests) ≈ many hours to days — intentional.
[sources.baostock]
enabled = true
min_interval_seconds = 1.0
batch_size = 20
batch_rest_seconds = 120

[adj_factors]
source = "sina"
adjust_types = ["hfq"]

[sentiment]
# Batch path uses keyword lexicon only; SnowNLP is for on-demand stock_news.
use_snownlp = false
# HTTP stock_news fallback cap (primary news channel is curated news_headlines).
news_symbol_limit = 50

[failover]
enabled = true

[[failover.datasets]]
name = "daily_bars"
primary = "tdx_protocol"
backup = "eastmoney"
compare_fields = ["close", "volume"]
price_tolerance_bps = 10

[[failover.datasets]]
name = "corporate_actions"
primary = "eastmoney"
backup = "tdx_protocol"
compare_fields = ["cash_dividend", "bonus_ratio", "transfer_ratio"]
price_tolerance_bps = 10

[universe]
default = "all_a"

# Wave DAG for daily job (see docs/datasets/catalog.md)
[[job.daily.waves]]
name = "reference"
parallel = true
steps = ["instruments", "trading_calendar", "trading_status"]

[[job.daily.waves]]
name = "corp_actions_to_bars"
parallel = false
steps = ["corporate_actions", "daily_bars"]

[[job.daily.waves]]
name = "parallel_core"
parallel = true
steps = ["index_bars"]

[[job.daily.waves]]
name = "finalize"
parallel = false
steps = ["compact", "derive_adj_factors", "audit"]

[job.daily.groups.core]
at = "16:00"
steps = [
  "instruments", "trading_calendar", "trading_status",
  "corporate_actions", "daily_bars", "index_bars",
  "compact", "derive_adj_factors",
]

[job.daily.groups.capital]
at = "16:30"
steps = [
  "fund_flow", "northbound_holdings", "northbound_flows", "margin_trading",
  "valuation_metrics", "sector_members", "announcement_index",
  "compact",
]

[job.daily.groups.signals]
at = "17:00"
steps = ["dragon_tiger", "block_trades", "compact"]

[job.daily.groups.fundamentals]
at = "17:30"
steps = [
  "financial_statement_items", "earnings_disclosure_schedule",
  "index_constituents", "industry_members", "compact",
]

[job.daily.groups.macro_risk]
at = "18:00"
steps = ["macro_indicators", "market_breadth", "share_unlock_schedule", "regulatory_events", "commodity_bars", "compact"]

[job.daily.groups.research]
at = "18:30"
# Rotation / headlines before sentiment so batch can score lake news without HTTP.
steps = ["institutional_holdings", "analyst_consensus",
  "hot_rank", "sector_bars", "sector_fund_flow", "news_headlines", "flash_news_wire",
  "sentiment_scores", "compact"]

[job.init.phases]
names = [
  "phase1_reference",
  "phase2a_corporate_actions",
  "phase2c_daily_bars_backfill",
  "phase3_index_and_status",
  "phase4_finalize",
]

[on_demand]
enabled = true
datasets = ["stock_news", "research_reports"]

[duckdb]
path = "{data.root}/duckdb/ashare-lake.duckdb"
memory_limit = "2GB"
threads = 4
