[data]
root = "./data/stock-data-engine"

[orchestrator]
workers = 8
batch_size = 100
max_retries = 3
retry_backoff_seconds = 5
batch_stale_seconds = 3600  # running batches without heartbeat for this long → stale (compact gate) / failed (retry)

[tdx_protocol]
enabled = true
min_interval_ms = 50
servers = "auto"
connect_timeout_sec = 10
# Test/demo only: return fabricated rows (labeled source="mock") instead of
# failing when the TDX source is unavailable. Never enable in production.
allow_mock = false

# Preferred standard-market host pool. When servers="auto", these are probed
# in parallel (first that returns real data wins) before the mootdx bundled
# list. Fill with hosts known-good for your network; leave empty to rely on
# the bundled list. Extended (HK/futures) hosts do not serve A-share bars.
[tdx_protocol.hosts]
standard = [
    "120.76.1.198:7709",
    "123.125.108.101:7709",
    "114.141.177.118:7709",
    "114.141.177.40:7709",
    "27.151.2.113:7709",
    "27.151.2.38:7709",
    "202.100.166.12:7709",
    "182.118.8.9:7709",
    "1.202.143.37:7709",
    "111.203.134.118:7709",
    "117.133.128.226:7709",
]

[sources.eastmoney]
enabled = true
min_interval_seconds = 1.0

[sources.cninfo]
enabled = true

[sources.akshare]
enabled = true

[sources.sina]
enabled = true
min_interval_seconds = 0.2

[adj_factors]
source = "sina"
adjust_types = ["hfq"]

[sentiment]
use_snownlp = true
news_symbol_limit = 300

[failover]
enabled = true

[[failover.datasets]]
name = "daily_bars"
primary = "tdx_protocol"
backup = "eastmoney"
compare_fields = ["close", "volume"]
price_tolerance_bps = 10

[[failover.datasets]]
name = "corporate_actions"
primary = "eastmoney"
backup = "tdx_protocol"
compare_fields = ["cash_dividend", "bonus_ratio", "transfer_ratio"]
price_tolerance_bps = 10

[universe]
default = "all_a"

# Wave DAG for daily job (see docs/PRD.md)
[[job.daily.waves]]
name = "reference"
parallel = true
steps = ["instruments", "trading_calendar", "trading_status"]

[[job.daily.waves]]
name = "corp_actions_to_bars"
parallel = false
steps = ["corporate_actions", "daily_bars"]

[[job.daily.waves]]
name = "parallel_core"
parallel = true
steps = ["index_bars"]

[[job.daily.waves]]
name = "finalize"
parallel = false
steps = ["compact", "derive_adj_factors", "audit"]

[job.daily.groups.core]
at = "16:00"
steps = [
  "instruments", "trading_calendar", "trading_status",
  "corporate_actions", "daily_bars", "index_bars",
  "compact", "derive_adj_factors",
]

[job.daily.groups.capital]
at = "16:30"
steps = [
  "fund_flow", "northbound_holdings", "northbound_flows", "margin_trading",
  "valuation_metrics", "sector_members", "announcement_index",
  "compact",
]

[job.daily.groups.signals]
at = "17:00"
steps = ["dragon_tiger", "block_trades", "compact"]

[job.daily.groups.fundamentals]
at = "17:30"
steps = ["financial_statement_items", "index_constituents", "industry_members", "compact"]

[job.daily.groups.macro_risk]
at = "18:00"
steps = ["macro_indicators", "market_breadth", "share_unlock_schedule", "regulatory_events", "compact"]

[job.daily.groups.research]
at = "18:30"
steps = ["institutional_holdings", "analyst_consensus", "sentiment_scores",
  "hot_rank", "sector_bars", "sector_fund_flow", "news_headlines", "compact"]

[job.init.phases]
names = [
  "phase1_reference",
  "phase2a_corporate_actions",
  "phase2c_daily_bars_backfill",
  "phase3_index_and_status",
  "phase4_finalize",
]

[on_demand]
enabled = true
datasets = ["announcement_body", "stock_news", "research_reports", "financial_reports"]

[duckdb]
path = "{data.root}/duckdb/stockdata.duckdb"
memory_limit = "2GB"
threads = 4
